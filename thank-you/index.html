<!DOCTYPE html>
<html lang="en-US">
<head>

<title>Thank you — Edwards Roofing &amp; Construction</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root { --brand:#B20D0B; --brand-dark:#8a0908; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Arial,sans-serif;color:#222;background:#fff;line-height:1.5}

  p{font-size:17px;color:#666;margin:0 0 12px}
  .cta{display:inline-block;margin-top:32px;padding:14px 36px;background:var(--brand);color:#fff;text-transform:uppercase;font-weight:600;letter-spacing:1px;font-size:14px;text-decoration:none}

  .phone{margin-top:48px;font-size:15px;color:#444}

</head>

  <span class="accent"></span>
